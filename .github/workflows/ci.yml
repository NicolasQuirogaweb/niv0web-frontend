name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      REACT_APP_BACKEND_URL: http://localhost:5000
      REACT_APP_GOOGLE_CLIENT_ID: ci-placeholder-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint

      - run: npm test -- --watchAll=false

      - run: npm run build
